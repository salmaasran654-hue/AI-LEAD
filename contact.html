<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تواصل معنا - AI LEAD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0B1120;
      color: #FFFFFF;
      line-height: 1.6;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(37, 99, 235, 0.15);
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #2563EB, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span {
      font-weight: 300;
      -webkit-text-fill-color: #94A3B8;
    }
    .nav a {
      color: #94A3B8;
      text-decoration: none;
      margin-right: 15px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: 0.3s;
    }
    .nav a:hover { color: #38BDF8; }
    .page-title {
      text-align: center;
      padding: 50px 0 20px;
    }
    .page-title h1 {
      font-size: 3rem;
      font-weight: 800;
    }
    .page-title h1 span {
      background: linear-gradient(135deg, #2563EB, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-title p {
      color: #94A3B8;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin: 40px 0 50px;
    }
    .contact-form {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(37,99,235,0.1);
      border-radius: 24px;
      padding: 30px;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 16px;
      border-radius: 16px;
      border: 1px solid rgba(37,99,235,0.15);
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: #2563EB;
      box-shadow: 0 0 20px rgba(37,99,235,0.1);
    }
    .contact-form textarea {
      height: 150px;
      resize: vertical;
    }
    .contact-form button {
      background: linear-gradient(135deg, #2563EB, #8B5CF6);
      border: none;
      padding: 14px 36px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    .contact-form button:hover {
      transform: scale(1.04);
      box-shadow: 0 0 30px rgba(37,99,235,0.3);
    }
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .info-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(37,99,235,0.08);
      border-radius: 20px;
      padding: 25px;
    }
    .info-card .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 8px;
    }
    .info-card h3 {
      color: #38BDF8;
      font-size: 1.1rem;
    }
    .info-card p {
      color: #94A3B8;
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .footer {
      border-top: 1px solid rgba(37,99,235,0.08);
      padding: 25px 0;
      text-align: center;
      color: #64748B;
      font-size: 0.9rem;
    }
    .footer span { color: #38BDF8; }
    @media (max-width: 700px) {
      .header { flex-direction: column; align-items: center; gap: 12px; }
      .nav { justify-content: center; flex-wrap: wrap; }
      .nav a { margin: 0 8px; }
      .page-title h1 { font-size: 2.2rem; }
      .contact-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">AI <span>LEAD</span></div>
      <div class="nav">
        <a href="index.html">الرئيسية</a>
        <a href="courses.html">الدورات</a>
        <a href="videos.html">الفيديوهات</a>
        <a href="analyzer.html">تحليل الموقع</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل</a>
        <a href="login.html">تسجيل الدخول</a>
      </div>
    </div>

    <div class="page-title">
      <h1>📬 <span>تواصل معنا</span></h1>
      <p>نحن هنا لمساعدتك، تواصل معنا بأي استفسار</p>
    </div>

    <div class="contact-grid">
      <div class="contact-form">
        <input type="text" placeholder="الاسم بالكامل" />
        <input type="email" placeholder="البريد الإلكتروني" />
        <input type="text" placeholder="الموضوع" />
        <textarea placeholder="اكتب رسالتك..."></textarea>
        <button>إرسال</button>
      </div>

      <div class="contact-info">
        <div class="info-card">
          <span class="icon">📧</span>
          <h3>البريد الإلكتروني</h3>
          <p>info@ailead.com</p>
        </div>
        <div class="info-card">
          <span class="icon">📱</span>
          <h3>واتساب</h3>
          <p>+20 100 000 0000</p>
        </div>
        <div class="info-card">
          <span class="icon">🌐</span>
          <h3>وسائل التواصل</h3>
          <p>فيسبوك · تويتر · لينكدإن</p>
        </div>
      </div>
    </div>

    <div class="footer">
      © 2026 <span>AI LEAD</span> — جميع الحقوق محفوظة
    </div>
  </div>

</body>
</html>
