<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الصفحة غير موجودة - AI LEAD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0B1120;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box h1 { font-size: 6rem; background: linear-gradient(135deg, #2563EB, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .box h2 { font-size: 2rem; margin: 10px 0; }
    .box p { color: #94A3B8; }
    .box a { display: inline-block; margin-top: 20px; background: #2563EB; color: #fff; padding: 12px 30px; border-radius: 40px; text-decoration: none; font-weight: 600; }
    .box a:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>الصفحة غير موجودة</h2>
    <p>عذراً، الصفحة التي تبحث عنها غير متاحة</p>
    <a href="index.html">🏠 العودة للرئيسية</a>
  </div>
</body>
</html>
