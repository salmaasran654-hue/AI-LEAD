<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المفضلة - AI Hub Egypt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f6f5;
      color: #2d1b1b;
    }
    .header {
      background: #6b1d2b;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo { font-size: 2rem; font-weight: bold; color: white; }
    .logo span { color: #f5c6c6; }
    .nav a {
      color: #f5e1e1;
      text-decoration: none;
      margin-right: 25px;
      font-weight: 500;
    }
    .nav a:hover { color: white; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 2.8rem; color: #6b1d2b; text-align: center; }
    .sub { text-align: center; color: #4d3a3a; margin-bottom: 40px; }
    .card {
      background: white;
      border-radius: 24px;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #f0e6e6;
      margin-bottom: 15px;
    }
    .card .info h3 { color: #6b1d2b; }
    .card .info p { color: #4d3a3a; }
    .card .fav-btn {
      background: #6b1d2b;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }
    .card .fav-btn:hover { background: #4f1520; }
    .footer {
      background: #6b1d2b;
      padding: 20px;
      text-align: center;
      color: #f5e1e1;
      margin-top: 50px;
    }
    .footer span { color: #f5c6c6; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🤖 AI <span>Hub Egypt</span></div>
    <div class="nav">
      <a href="index.html">الرئيسية</a>
      <a href="favorites.html">المفضلة</a>
      <a href="login.html">تسجيل الدخول</a>
    </div>
  </div>

  <div class="container">
    <h1>⭐ المفضلة</h1>
    <p class="sub">أدواتك المفضلة في مكان واحد</p>
    <div id="favoritesList"></div>
  </div>

  <div class="footer">
    © 2026 <span>AI Hub Egypt</span> — جميع الحقوق محفوظة
  </div>

  <script>
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const list = document.getElementById('favoritesList');

    if (favorites.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:#888;">لا توجد أدوات مفضلة حتى الآن</p>';
    } else {
      list.innerHTML = favorites.map(tool => `
        <div class="card">
          <div class="info">
            <h3>${tool}</h3>
            <p>أداة مفضلة</p>
          </div>
          <button class="fav-btn" onclick="removeFav('${tool}')">إزالة</button>
        </div>
      `).join('');
    }

    function removeFav(tool) {
      let favs = JSON.parse(localStorage.getItem('favorites') || '[]');
      favs = favs.filter(f => f !== tool);
      localStorage.setItem('favorites', JSON.stringify(favs));
      location.reload();
    }
  </script>
</body>
</html>
