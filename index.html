<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>صندوق الوارد - AI LEAD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0B1120;
      color: #FFFFFF;
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container { max-width: 1000px; margin: auto; }
    h1 { text-align: center; font-size: 2.8rem; margin-bottom: 30px; }
    h1 span { background: linear-gradient(135deg, #2563EB, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .msg-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(37,99,235,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      transition: 0.3s;
    }
    .msg-card:hover { border-color: #2563EB; transform: translateX(-4px); }
    .msg-card .header {
      display: flex;
      justify-content: space-between;
      color: #94A3B8;
      font-size: 0.9rem;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .msg-card .header strong { color: #38BDF8; }
    .msg-card .subject { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .msg-card .message { color: #94A3B8; margin-top: 6px; }
    .empty { text-align: center; color: #64748B; padding: 50px 0; font-size: 1.2rem; }
    .empty .icon { font-size: 4rem; display: block; margin-bottom: 16px; }
    .back { display: inline-block; margin-top: 30px; color: #38BDF8; text-decoration: none; font-weight: 600; }
    .back:hover { text-decoration: underline; }
    .refresh-btn {
      background: #2563EB;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 25px;
    }
    .refresh-btn:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(37,99,235,0.3); }
    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .stat-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(37,99,235,0.08);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat-box .num { font-size: 1.6rem; font-weight: 800; color: #38BDF8; }
    .stat-box .label { color: #94A3B8; font-size: 0.9rem; }
    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      justify-content: center;
    }
    .nav-links a {
      color: #94A3B8;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid transparent;
    }
    .nav-links a:hover {
      color: #38BDF8;
      border-color: rgba(37,99,235,0.2);
    }
    .nav-links a.active {
      color: #38BDF8;
      border-color: #2563EB;
      background: rgba(37,99,235,0.05);
    }
    .featured-link {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;
      background: linear-gradient(135deg, #2563EB, #8B5CF6);
      border-radius: 60px;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 0 30px rgba(37,99,235,0.2);
    }
    .featured-link:hover {
      transform: scale(1.04);
      box-shadow: 0 0 50px rgba(37,99,235,0.4);
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(37,99,235,0.08);
      margin: 30px 0;
    }
    @media (max-width: 700px) {
      h1 { font-size: 2rem; }
      .msg-card .header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📥 <span>صندوق الوارد</span></h1>

    <div class="nav-links">
      <a href="index.html">🏠 الرئيسية</a>
      <a href="contact.html">📬 تواصل</a>
      <a href="ai-ideas.html" class="active">💡 أفكار إبداعية</a>
      <a href="login.html">🔐 تسجيل الدخول</a>
    </div>

    <!-- رابط مميز لأفكار إبداعية -->
    <div style="text-align: center;">
      <a href="ai-ideas.html" class="featured-link">💡 جرب مولد الأفكار الإبداعية الآن!</a>
    </div>

    <hr class="divider" />

    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
      <div class="stats">
        <div class="stat-box"><span class="num" id="msgCount">0</span><span class="label">رسائل</span></div>
        <div class="stat-box"><span class="num" id="unreadCount">0</span><span class="label">جديدة</span></div>
      </div>
      <button class="refresh-btn" onclick="loadMessages()">🔄 تحديث</button>
    </div>

    <div id="messagesContainer"></div>

    <div style="text-align: center;">
      <a href="contact.html" class="back">⬅️ العودة للتواصل</a>
    </div>
  </div>

  <script>
    function loadMessages() {
      const container = document.getElementById('messagesContainer');
      const msgCount = document.getElementById('msgCount');
      const unreadCount = document.getElementById('unreadCount');

      const messages = JSON.parse(localStorage.getItem('contactMessages') || '[]');

      msgCount.textContent = messages.length;

      const now = new Date();
      const newMessages = messages.filter(msg => {
        const msgDate = new Date(msg.date);
        const diff = (now - msgDate) / (1000 * 60 * 60);
        return diff < 24;
      });
      unreadCount.textContent = newMessages.length;

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <span class="icon">📭</span>
            لا توجد رسائل حتى الآن
          </div>
        `;
        return;
      }

      const sortedMessages = [...messages].reverse();

      container.innerHTML = sortedMessages.map((msg, index) => `
        <div class="msg-card">
          <div class="header">
            <span><strong>${msg.name || 'غير معروف'}</strong> · ${msg.email || 'بريد غير موجود'}</span>
            <span>${msg.date || 'تاريخ غير معروف'}</span>
          </div>
          <div class="subject">${msg.subject || 'بدون موضوع'}</div>
          <div class="message">${msg.message || 'لا يوجد محتوى'}</div>
        </div>
      `).join('');
    }

    window.onload = loadMessages;
  </script>
</body>
</html>
