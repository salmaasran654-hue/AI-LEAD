<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✅ تم التحديث بنجاح</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0B1120;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      background: rgba(255,255,255,0.03);
      border: 3px solid #38BDF8;
      border-radius: 30px;
      padding: 50px 60px;
      box-shadow: 0 0 80px rgba(56, 189, 248, 0.2);
    }
    h1 {
      font-size: 3.5rem;
      background: linear-gradient(135deg, #2563EB, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      background: #2563EB;
      padding: 12px 40px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎉 التحديث شغال!</h1>
    <p style="color: #94A3B8; font-size: 1.3rem; margin-top: 15px;">
      لو انتِ شايفة الصفحة دي، يبقى الموقع بيستقبل التعديلات الجديدة.
    </p>
    <div class="badge">✅ تم النشر بنجاح</div>
  </div>
</body>
</html>
