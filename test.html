<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اختبار التحديث - AI LEAD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0B1120;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      background: rgba(255,255,255,0.03);
      border: 2px solid #2563EB;
      border-radius: 30px;
      padding: 50px 60px;
      box-shadow: 0 0 60px rgba(37, 99, 235, 0.15);
    }
    h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #2563EB, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      font-size: 1.3rem;
      margin-top: 15px;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      background: #2563EB;
      padding: 10px 30px;
      border-radius: 60px;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ التحديث شغال!</h1>
    <p>لو انتِ شايفة الصفحة دي، يبقى الموقع بيستقبل التعديلات الجديدة.</p>
    <div class="badge">🚀 تم النشر بنجاح</div>
  </div>
</body>
</html>
