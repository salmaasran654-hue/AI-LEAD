<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التقييمات - AI Hub Egypt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f6f5;
      color: #2d1b1b;
    }
    .header {
      background: #6b1d2b;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo { font-size: 2rem; font-weight: bold; color: white; }
    .logo span { color: #f5c6c6; }
    .nav a {
      color: #f5e1e1;
      text-decoration: none;
      margin-right: 25px;
      font-weight: 500;
    }
    .nav a:hover { color: white; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 2.8rem; color: #6b1d2b; text-align: center; }
    .sub { text-align: center; color: #4d3a3a; margin-bottom: 30px; }
    .review-card {
      background: white;
      border-radius: 24px;
      padding: 25px 30px;
      border: 1px solid #f0e6e6;
      margin-bottom: 20px;
    }
    .review-card .top { display: flex; justify-content: space-between; align-items: center; }
    .review-card .name { font-weight: bold; color: #6b1d2b; }
    .review-card .stars { color: #f5b342; font-size: 1.3rem; }
    .review-card .comment { margin-top: 12px; color: #4d3a3a; }
    .add-review {
      background: white;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid #f0e6e6;
      margin-top: 30px;
    }
    .add-review h3 { color: #6b1d2b; margin-bottom: 15px; }
    .add-review input, .add-review textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0cfcf;
      border-radius: 16px;
      margin-bottom: 15px;
      font-size: 1rem;
      outline: none;
    }
    .add-review input:focus, .add-review textarea:focus { border-color: #6b1d2b; }
    .add-review button {
      background: #6b1d2b;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .add-review button:hover { background: #4f1520; }
    .footer {
      background: #6b1d2b;
      padding: 20px;
      text-align: center;
      color: #f5e1e1;
      margin-top: 50px;
    }
    .footer span { color: #f5c6c6; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🤖 AI <span>Hub Egypt</span></div>
    <div class="nav">
      <a href="index.html">الرئيسية</a>
      <a href="favorites.html">المفضلة</a>
      <a href="login.html">تسجيل الدخول</a>
    </div>
  </div>

  <div class="container">
    <h1>⭐ التقييمات</h1>
    <p class="sub">آراء المستخدمين في أدوات الذكاء الاصطناعي</p>

    <div id="reviewsList"></div>

    <div class="add-review">
      <h3>✍️ أضف تقييمك</h3>
      <input type="text" id="reviewName" placeholder="اسم الأداة" />
      <input type="number" id="reviewStars" placeholder="عدد النجوم (1-5)" min="1" max="5" />
      <textarea id="reviewComment" rows="3" placeholder="اكتب رأيك..."></textarea>
      <button id="addReviewBtn">إضافة تقييم</button>
    </div>
  </div>

  <div class="footer">
    © 2026 <span>AI Hub Egypt</span> — جميع الحقوق محفوظة
  </div>

  <script>
    const reviewsList = document.getElementById('reviewsList');
    const nameInput = document.getElementById('reviewName');
    const starsInput = document.getElementById('reviewStars');
    const commentInput = document.getElementById('reviewComment');
    const addBtn = document.getElementById('addReviewBtn');

    let reviews = JSON.parse(localStorage.getItem('reviews') || '[]');

    function displayReviews() {
      if (reviews.length === 0) {
        reviewsList.innerHTML = '<p style="text-align:center; color:#888;">لا توجد تقييمات حتى الآن. كن أول من يقيّم! 🌟</p>';
        return;
      }
      reviewsList.innerHTML = reviews.map(r => `
        <div class="review-card">
          <div class="top">
            <span class="name">${r.name}</span>
            <span class="stars">${'⭐'.repeat(r.stars)}</span>
          </div>
          <div class="comment">${r.comment}</div>
        </div>
      `).join('');
    }

    displayReviews();

    addBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const stars = parseInt(starsInput.value);
      const comment = commentInput.value.trim();

      if (!name || !stars || !comment) {
        alert('❌ الرجاء ملء جميع الحقول');
        return;
      }

      if (stars < 1 || stars > 5) {
        alert('❌ عدد النجوم يجب أن يكون بين 1 و 5');
        return;
      }

      reviews.push({ name, stars, comment });
      localStorage.setItem('reviews', JSON.stringify(reviews));
      displayReviews();
      nameInput.value = '';
      starsInput.value = '';
      commentInput.value = '';
    });
  </script>
</body>
</html>
